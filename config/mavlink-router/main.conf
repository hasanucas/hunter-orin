[General]
TcpServerPort=5760
ReportStats=false
MavlinkDialect=auto

# CUAV V5+ — Type-C/USB. Yeni Orin'de /dev/ttyACM1 olabilir; gerekirse degistir.
[UartEndpoint fc]
Device=/dev/ttyACM0
Baud=115200

# runtracker (kcfTracker) — RC oku + OSD telemetri
[UdpEndpoint runtracker]
Mode=Server
Address=0.0.0.0
Port=14550

# Python beyin (controller_orin.py) — ATTITUDE/RC oku + RC_OVERRIDE yaz
[UdpEndpoint brain]
Mode=Server
Address=0.0.0.0
Port=14551

# QGC / Mission Planner (opsiyonel, debug) — aginizdaki PC'den TCP 5760'a da baglanabilir
[UdpEndpoint qgc]
Mode=Server
Address=0.0.0.0
Port=14552
